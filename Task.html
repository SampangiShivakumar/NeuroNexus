<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Form</title>
  <style>
    body {
      background-color:rgb(129, 230, 234);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .form-container {
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(30, 29, 29, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #202124;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: rgb(83, 82, 82);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid rgb(59, 57, 57);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .gender-options {
      margin-bottom: 20px;
    }

    .gender-options label {
      font-weight: normal;
      margin-right: 15px;
    }

    .submit-button {
      background-color: blue;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }

    .submit-button:hover {
      background-color: #7095bc;
    }
  </style>
</head>
<body>

  <form class="form-container">
    <h2>Google Form</h2>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required>

    <label for="phone">Contact Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" required></textarea>

    <label for="company">Company Name</label>
    <input type="text" id="company" name="company" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="department">Department</label>
    <select id="department" name="department" required>
      <option value="" disabled selected>Select department</option>
      <option value="HR">HR</option>
      <option value="Sales">Sales</option>
      <option value="Development">Development</option>
      <option value="Marketing">Marketing</option>
      <option value="Others">Others</option>
    </select>

    <label>Gender</label>
    <div class="gender-options">
      <input type="radio" id="male" name="gender" value="Male" required>
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label>

      <input type="radio" id="notsay" name="gender" value="Prefer not to say">
      <label for="notsay">Prefer not to say</label>
    </div>

    <button type="submit" class="submit-button">Submit</button>
  </form>

</body>
</html>
